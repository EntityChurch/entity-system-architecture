# ── Agent + methodology overlay ───────────────────────────────────────────────
# Shared, byte-identical, injected fleet-wide (ADR-0010 / ADR-0028). Declared here
# 2026-08-23 on the operator's ruling — "the agent standard is canonical, it should
# be included in all of them." Arch was one of seven repos that had never declared
# it; keystone, entity-core-protocol and entity-system-arch-tools already did.
# Both are verified free of commit SHAs, so declaring them adds nothing to the
# `spec pins` backlog.
#
# `AGENTS.md` is declared too — operator ruling 2026-08-23, overriding arch's
# initial call to leave it out. Arch had reasoned that the charter is working
# memory (31 commit SHAs, seat-by-seat cohort argument, live rulings) and that
# ADR-0031 keeps working memory off the published surface. The ruling is that the
# agent guidance is canonical, full stop — and `entity-system-arch-tools` already
# declared its own, so arch was the outlier.
#
# CONSEQUENCE, stated so it is not a surprise: `AGENTS.md`'s commit SHAs are now
# ON the published surface and inside `spec pins`' scope. That is the P-3 sweep
# growing, not a new defect — and it is the honest accounting, since those pins
# were always going to be read by someone.

