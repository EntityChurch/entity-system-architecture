# ── The internal record: durable, committed, never published ──────────────────
# ⭐ DECLARED 2026-09-20, DURING RELEASE PREP, AND THE DECLARATION IS THE POINT.
# The pre-cut omission advisory names five prose files that sit under `docs/` —
# a path prefix the filter reads — and are in no keep-list, so they are dropped
# and reach no reader. That is the RIGHT outcome for all five, and until now it
# was the right outcome BY ACCIDENT: a file nobody declared and a file
# deliberately withheld are the same silence from outside, and the next session
# had no way to tell which it was looking at.
#
# `[[living]] internal = true` is the standard's word for exactly this — durable,
# edited in place, and never published. It is NOT the keep-list, so declaring
# these changes what ships by nothing at all; `spec pins` scope is unaffected and
# none of their commit citations joins the published-pin backlog.
#
# Why each is internal, by the operator's own test — *someone pulled the repo and
# started working: would they want or need this?*
#
#   · DISCIPLINE-CHARTER     already ruled internal 2026-09-08; the reasoning is
#                            above, under "Working here". This is that ruling
#                            finally written as a declaration rather than as an
#                            absence.
#   · ANTI-PATTERN-CASEBOOK  the incident behind each lifecycle rule — seat names,
#                            dates, what each mistake cost us. A rulebook's
#                            worked cases, addressed to us.
#   · COHORT-OPEN-ITEMS      the cohort ledger: who owes what, routing state, gate
#                            names, build-state measurements. Every row expires;
#                            none of it is addressed to a stranger.
#   · DESIGN-REGISTER        a POINTER index, never an authority — and its own §0
#                            opens on an operator quote and names sibling seats
#                            throughout. The documents it points AT publish; the
#                            index of how we found them does not.
#   · LEGACY-ARCHIVE-INDEX   the title index of the 1,068-document pre-split
#                            archive, which is not in this repo. Published text
#                            says "the pre-split archive" and never an internal
#                            path (L24) — this file IS the internal path.
#
# ⚠ The advisory is path-based and keeps printing after this: it lists prose that
# is not in the payload, whatever the manifest says. It is meant to be read and
# triaged, not silenced, and the answer for these five is now on the record here
# instead of in a session's head.
[[living]]
path     = "docs/DISCIPLINE-CHARTER.md"
internal = true

[[living]]
path     = "docs/ANTI-PATTERN-CASEBOOK.md"
internal = true

[[living]]
path     = "docs/COHORT-OPEN-ITEMS.md"
internal = true

[[living]]
path     = "docs/DESIGN-REGISTER.md"
internal = true

[[living]]
path     = "docs/LEGACY-ARCHIVE-INDEX.md"
internal = true
