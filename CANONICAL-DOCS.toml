group = "Overview"

# The rolling canonical log. MOVED `docs/status/STATUS.md` → `docs/STATUS.md` on 2026-08-23
# and re-declared here, per [ADR-0031] as corrected the day it landed.
#
# ** WHAT `docs/status/` PUBLISHES: NOTHING. ** The dated `STATUS-*` / `ROUTING-*` /
# `HANDOFF-*` / `CHECKPOINT-*` snapshots there are internal working memory — no scrub
# obligation, no pin hygiene, no audience. Write them for the next session.
#
# Why a MOVE and not a re-declaration, which is the durable half: with the rolling log at
# `docs/STATUS.md` the two kinds separate by PATH instead of by remembering a filename, so
# `docs/status/` can be dropped wholesale and the canonical log is never in the blast
# radius. [ADR-0031] as first written banned the directory and took the rolling log with
# it; that property's absence is what made the mistake available.
#
# Against the published tree this reads as a deletion of the old path plus an addition of
# the new one. `.release-removals` carries the deletion half and says outright that it is a
# move, so the record is not mistaken for a withdrawal.
[[doc]]
path  = "docs/STATUS.md"
title = "Status"
blurb = "Current project status — where the project is, recent work, backlog, and what's next."
group = "Overview"

