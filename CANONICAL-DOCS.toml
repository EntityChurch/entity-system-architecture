# ── Product trees ─────────────────────────────────────────────────────────────
# `[[keep_tree]]` declares a DIRECTORY as product rather than dev history
# (built in the release tooling on this repo's ask). Everything prose under
# it survives the release filter without a per-file entry.
#
# Why arch needs it and most repos do not: for a code repo, `docs/` really is dev
# history and the filter's default is right. Here the output IS prose. Most of it
# is `specs/` and `guides/`; the rest is the design record that makes those
# legible. Same directory name, different function — which is the filter's own
# stated lesson, written about .cbor vectors: "location is not function."
#
# The structural argument, and it is the one that matters: this repo's central
# authoring rule is that a specification does NOT carry its own rationale — no
# seat names, no dated measurements, no commit hashes — because that material is
# rationale, and rationale lives in the proposal. It is enforced by a ratcheted
# baseline. Publishing the specs without the proposals would mean deliberately
# stripping derivation out of the normative text and then not shipping the place
# we put it: MUSTs with no reachable reason for any of them.
#
# NOT declared per-file, deliberately. 119 hand-written entries is not a
# mechanism, and it regenerates with every new proposal — the same "re-breaks by
# being used as intended" argument [ADR-0031] used against sweeping status docs.
[[keep_tree]]
path = "docs/proposals"
why  = "the design record — the ratifiable unit, and where this repo's rules send every spec's rationale"

[[keep_tree]]
path = "docs/research/explorations"
why  = "the design-space studies the specs are ruled inside of; L11 makes reading them a precondition of ruling"

# ── The product itself: `specs/` and `guides/` ────────────────────────────────
# ⭐ CONVERTED FROM 78 PER-FILE `[[doc]]` ENTRIES, 2026-09-20, AND THE REASON IS A
# MEASUREMENT RATHER THAN A PREFERENCE. Those 78 entries did not control what
# shipped. They never had.
#
# The filter only drops prose that is UNDER A DOC ROOT (`docs/`, `research/`,
# `status/`, `validation/`, ...) or LOOSE AT THE TOP LEVEL. `specs/` and `guides/`
# are neither: `canon.go`'s own safety rule protects prose nested under code/spec
# directories, naming `specs/` and `guides/` explicitly, because dropping a module
# README or the spec itself would break the published repo. So every file under
# them shipped whether or not this manifest mentioned it.
#
# MEASURED, by running the real filter from a source build over an export of
# HEAD, twice — once with all 78 entries and once with none:
#   · both runs dropped 495 files
#   · the two filtered trees are byte-for-byte IDENTICAL
#   · `spec pins` scope went 322 → 324 declared docs — it GREW
#
# The +2 is the cost of the old mechanism, and it is why this is a fix and not a
# tidy-up. `APP-CONVENTION-FEED.md` (v0.3.1, binding) and `APP-CONVENTION-REFERENCE.md`
# (v0.1, binding) landed 2026-09-08/09 and NOBODY ADDED THEM. They were published the
# whole time — the filter protects them — but they were invisible to every gate scoped
# to the keep-list, and they are cited 8 and 5 times respectively from files that ARE
# declared, including 12 times from APP-CONVENTION-SEMANTIC-CONTENT-SITE.
#
# ⚠ SO THE HAZARD THIS REMOVES IS NOT A PUBLICATION HAZARD — IT IS A FALSE CONTROL.
# An enumeration that reads like a publication decision and is in fact decoration is
# worse than no list, because people reason from it. Nothing about dropping a WIP
# draft into `specs/` got riskier here: it published before this change and it
# publishes after. What changed is that the manifest no longer claims otherwise, and
# that `check-declared-trees` now watches these two directories for composition drift,
# which is a real control where the list was not.
[[keep_tree]]
path = "specs"
why  = "the normative specification surface — the extension family, the SDK specs, the L5 application conventions and the authoring standards. This repo's product"

[[keep_tree]]
path = "guides"
why  = "the implementer guides — the other half of the product, and the surface an extension author copies from"

# Two rulings that were attached to per-file entries removed above, kept because the
# decision is still live and this is now its only home in this file:
#
# `specs/domains/` — RETIRED 2026-09-14. Bridge extensions (an extension that reaches OUT
# of the entity system onto a foreign technology, one document per technology) now live at
# `specs/bridge-extensions/`. The word "domain" was defined once and circularly, and the
# study that produced the family framing rejected it outright. See SYSTEM-ARCHITECTURE
# §13.1. `.release-removals` carries the deletion half.
#
# `specs/ENTITY-SYSTEM-REFERENCE.md` — RETIRED 2026-09-08 and moved to `docs/archive/`.
# A condensed restatement is the class `SPECIFICATION-FORMAT.md` §8.4.3 forbids authoring,
# and it was never a citation target. Do not re-declare it; do not author a successor.

# `docs/research/reviews/` — dated peer reviews, absorbed into the design record and never
# published. The comment below already said we drop them on purpose; this says it in a form
# the release filter can read. **It records what is already true rather than deciding
# anything**: measured against the live public tree, zero files under this path have ever
# been published, and this declaration keeps it that way.
#
# Without it the six dated filenames here are prose BELOW the top-level doc roots, which is
# invisible to the release filter — so the failure mode is publication, not omission, and it
# leaves no diff to notice.
[[area]]
path      = "docs/research/reviews"
kind      = "status"
publishes = false

# The index and the lifecycle README sit ONE LEVEL ABOVE the explorations keep_tree, so
# they were stripped while the 35 documents they describe published — caught by meta at the
# cut, 2026-08-24. Declared individually rather than widening the keep_tree to
# `docs/research`, which would drag in `reviews/` (22 files we drop on purpose).
#
# It is worth naming what this defect was: a reader would have received a flat directory
# of 35 explorations and nothing saying what they are. That is `entity-core-keystone`'s
# 0.8.2 defect with the halves swapped — there the index shipped and the evidence did not;
# here the evidence shipped and the index did not. Same seam, opposite side, one week apart.
[[doc]]
path  = "docs/research/INDEX.md"
title = "Research index — what has already been studied, and where it is"
blurb = "The inventory of the design record: what exists and what each document establishes. Read it before opening a design question — it is the enforcement point for the rule that you check what exists before building it."
group = "Working here"

[[doc]]
path  = "docs/research/README.md"
title = "Research workspace — the exploration → proposal → review → fold lifecycle"
blurb = "How work moves through this repo: an exploration maps a design space, a proposal is the ratifiable unit, a review absorbs a peer's findings, and the fold is the spec edit that lands it."
group = "Working here"

# ── Working here ──────────────────────────────────────────────────────────────
# Declared because PUBLISHED documents already cite it, and a keep-list that
# drops a cited target ships broken links on the public surface:
#   DOCTRINE-COHORT-STATE-TRACKING  <- EXTENSION-NETWORK, EXTENSION-SIGNALING, METHODOLOGY.md
#
# DISCIPLINE-CHARTER was declared here on the same grounds and is UNDECLARED as of
# 2026-09-08, by the operator's own test: *someone pulled the repo and started
# working — is it something they would want or need?* They would not. It is a
# rulebook about how THIS TEAM works — the L-numbering rationale, our own two
# guidance files drifting from each other four times, seat names, incident
# narrative — addressed to us and to nobody else. **What an outside contributor
# actually needs is already its own published document, CONTRIBUTING.md**: small
# fixes versus substantive changes, the proposal process, DCO. So there was
# nothing to split out; the publishable half was never in the charter.
#
# It stays committed at docs/DISCIPLINE-CHARTER.md, still the canonical home of
# the rule SET, still gated against AGENTS.md by `spec charter`, now sitting
# beside docs/ANTI-PATTERN-CASEBOOK.md where the incidents already live.
#
# This also makes its narrative-gate exclusion honest instead of convenient. It
# was excluded on rulebook grounds — *a rulebook quotes its own counter-examples*
# — which is defensible and is also exactly how the leak stayed invisible. The
# scope tracks the publication declaration, so an undeclared file is out of scope
# by the rule rather than by an exception. Keep the two in step.
[[doc]]
path  = "docs/DOCTRINE-COHORT-STATE-TRACKING.md"
title = "Doctrine — tracking cohort build state without asserting it stale"
blurb = "How a claim about what another implementation has built is made, dated and re-verified. Written after the same defect recurred: a measurement true when taken, plausible forever after, and invisible to review."
group = "Working here"

